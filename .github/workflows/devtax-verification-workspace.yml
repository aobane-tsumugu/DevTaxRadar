name: DevTax temporary verification workspace

# Bounded correction checks; no deployment, secrets or repository writes.
on:
  workflow_dispatch:
  push:
    branches: [work/c03-software-method-posting-20260920]
    paths:
      - .github/workflows/devtax-verification-workspace.yml
      - src/core/softwareMethod*.ts
      - src/client/workspaceRecovery.ts
      - tests/core/correctionPurposeJourney.test.ts
      - tests/client/correctionEditorHook.test.ts

permissions:
  contents: read

concurrency:
  group: devtax-verification-workspace
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve source before running tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node-runtime verification
          git rev-parse HEAD > node-runtime/source-commit.txt
          sha256sum package-lock.json > node-runtime/lockfile.sha256
          git archive --format=tar HEAD > "$RUNNER_TEMP/devtax-workspace.tar"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Capture checks without concealing failures
        shell: bash
        run: |
          set +e
          failed=0
          printf 'task\texit_status\n' > verification/status.tsv
          for task in docs:check typecheck test lint format:check build privacy:check; do
            filename="${task//:/-}"
            timeout --signal=TERM --kill-after=10s 120s npm run "$task" > "verification/$filename.log" 2>&1
            status=$?
            printf '%s\t%s\n' "$task" "$status" >> verification/status.tsv
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          cat verification/status.tsv >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: Package source and available runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node-runtime/bin verification
          cp "$(command -v node)" node-runtime/bin/node
          node --version > node-runtime/node-version.txt
          npm --version > node-runtime/npm-version.txt
          tar -rf "$RUNNER_TEMP/devtax-workspace.tar" node-runtime verification
          if [ -d node_modules ]; then tar -rf "$RUNNER_TEMP/devtax-workspace.tar" node_modules; fi
          gzip "$RUNNER_TEMP/devtax-workspace.tar"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: devtax-correction-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/devtax-workspace.tar.gz
          retention-days: 1
          if-no-files-found: error
