name: DevTax temporary verification workspace

# Branch-only, read-only verification. No deployment, secrets, or automatic push.
on:
  push:
    branches: [work/w07-w08-acceptance-20260918]
    paths: [.github/workflows/devtax-verification-workspace.yml]
  pull_request:
    paths: [.github/workflows/devtax-verification-workspace.yml]

permissions:
  contents: read

concurrency:
  group: devtax-w07-w08-verification-workspace
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/work/w07-w08-acceptance-20260918' || github.head_ref == 'work/w07-w08-acceptance-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 271ef56352ab782ff71434769ed1edb78565c513
          persist-credentials: false
      - name: Preserve exact baseline source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node-runtime verification
          git rev-parse HEAD > node-runtime/source-commit.txt
          sha256sum package-lock.json > node-runtime/lockfile.sha256
          git archive --format=tar HEAD > "$RUNNER_TEMP/devtax-workspace.tar"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install locked dependencies
        run: npm ci
      - name: Capture baseline checks without concealing failures
        shell: bash
        run: |
          set +e
          failed=0
          printf 'task\texit_status\telapsed_seconds\n' > verification/status.tsv
          for task in test lint format:check build privacy:check; do
            filename="${task//:/-}"
            started=$SECONDS
            timeout --signal=TERM --kill-after=5s 180s npm run "$task" > "verification/$filename.log" 2>&1
            status=$?
            printf '%s\t%s\t%s\n' "$task" "$status" "$((SECONDS-started))" >> verification/status.tsv
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          cat verification/status.tsv >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: Package baseline and available runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node-runtime/bin verification
          cp "$(command -v node)" node-runtime/bin/node
          node --version > node-runtime/node-version.txt
          npm --version > node-runtime/npm-version.txt
          tar -rf "$RUNNER_TEMP/devtax-workspace.tar" node-runtime verification
          if [ -d node_modules ]; then tar -rf "$RUNNER_TEMP/devtax-workspace.tar" node_modules; fi
          gzip "$RUNNER_TEMP/devtax-workspace.tar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devtax-workspace-271ef56
          path: ${{ runner.temp }}/devtax-workspace.tar.gz
          retention-days: 1
          if-no-files-found: error
