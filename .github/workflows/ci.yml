name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Temporary, private, one-day validation bundle. No .git, credentials,
      # environment dump, user data or transcript directories are included.
      - name: Prepare isolated validation inputs
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/devtax-validation
          git archive --format=tar HEAD | gzip > /tmp/devtax-validation/source.tar.gz
          cp "$(command -v node)" /tmp/devtax-validation/node24
          if test -d node_modules; then
            tar -czf /tmp/devtax-validation/dependencies.tar.gz node_modules
          fi

      - name: Retain isolated validation inputs for this repair
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: devtax-validation-inputs
          path: /tmp/devtax-validation/
          retention-days: 1
          compression-level: 1

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Check built output for private data
        run: npm run privacy:check
