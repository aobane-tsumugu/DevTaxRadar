name: Apply DevTax strategy patch

on:
  push:
    branches:
      - feat/cost-object-work-purpose-model

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract staged implementation
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.devtax-strategy-patch.part*.b64' > /dev/null; then
            cat .devtax-strategy-patch.part*.b64 | base64 --decode > /tmp/devtax-strategy-patch.tar.gz
            echo "2e8fb26e639aaa7a1ed8e9177b814c0edf52a725da63df111906759fe563c47c  /tmp/devtax-strategy-patch.tar.gz" | sha256sum --check -
            tar -xzf /tmp/devtax-strategy-patch.tar.gz
            rm -f .devtax-strategy-patch.part*.b64
          fi
          rm -f .github/workflows/apply-devtax-strategy-patch.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit implementation and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: implement beginner tax strategy ledger"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run privacy:check
      - run: npm run build
      - run: git diff --check
